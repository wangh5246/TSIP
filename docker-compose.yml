      TSIP_POSEIDON_TIMEOUT_SEC: "${TSIP_POSEIDON_TIMEOUT_SEC:-20}"
      RAPIDSNARK_BIN: "${RAPIDSNARK_BIN:-/usr/local/bin/rapidsnark}"
      TSIP_STATE_PATH: "/tmp/tsip_client_state.json"
      REPORT_TIMEOUT_SEC: "${REPORT_TIMEOUT_SEC:-20}"
      SEND_INTERVAL_SEC: "${SEND_INTERVAL_SEC:-0.03}"
      CLIENT_TOTAL: "50"
      CLIENT_TRAJ_SOURCE: "geolife"
