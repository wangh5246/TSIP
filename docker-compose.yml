      K: "50"
      KD: "50"
      DOMAIN: "10000"
      MASK_BITS: "32"
      CITY_SIZE_M: "10000"     # 城市边界：0..10000m (10km)
      CELL_SIZE_M: "100"       # 网格边长：100m
      GRID_W: "100"            # 每行网格数；100*100=10000 必须等于 DOMAIN
      DT_SEC: "10"             # 采样间隔 10 秒
      TRAJ_POINTS: "300"       # 一条轨迹 300 个点（50分钟）
      T_MAX_SEC: "600"         # 停留时间 clip 上限 600 秒
      MAX_STEP_M: "${CLIENT_MAX_STEP_M:-110.0}"
      QUANT_BITS: "4"          # INT4
      DUMMY_Q: "1"             # dummy 的量化值先固定为 1（便于你现有 dummy correction）
      DEBUG_CLIENT: "0"
      RANDOMNESS_SEED_URL: "http://aggregator_r:8003/risefl/seed"
      RANDOMNESS_PREVIEW_URL: "http://aggregator_r:8003/risefl/gaussian_preview"
      RAND_M: "8"
      RAND_DIM: "4"
      RAND_PREVIEW_N: "3"
      PROOF_ENABLE: "${CLIENT_PROOF_ENABLE:-0}"
      PROOF_M: "${PROOF_M:-8}"
      MALICIOUS_RATE: "${MALICIOUS_RATE:-0.1}"
      ZK_STEP_ENABLE: "${CLIENT_ZK_STEP_ENABLE:-1}"
      ZK_STEP_INDEX: "${ZK_STEP_INDEX:-10}"
      ZK_STEP_SNARKJS: "snarkjs"
      ZK_STEP_PROVER: "${ZK_STEP_PROVER:-rapidsnark}"
      ZK_STEP_WASM: "/app/zk/tsip_step/tsip_step_js/tsip_step.wasm"
      ZK_STEP_ZKEY: "/app/zk/tsip_step/tsip_step_final.zkey"
      ZK_STEP_TIMEOUT_SEC: "${ZK_STEP_TIMEOUT_SEC:-20}"
      TSIP_ENABLE: "${CLIENT_TSIP_ENABLE:-0}"
      TSIP_VERIFY_MODE: "${TSIP_VERIFY_MODE:-full}"
      TSIP_WINDOW_SEC: "${TSIP_WINDOW_SEC:-60}"
      TSIP_CIRCUIT_PROFILE: "${TSIP_CIRCUIT_PROFILE:-k6}"
      TSIP_ADWC_PROFILE: "${TSIP_ADWC_PROFILE:-k6}"
      TSIP_ADWC_WINDOW_K: "${TSIP_ADWC_WINDOW_K:-6}"
      TSIP_POLICY_CAP_RATIO: "${TSIP_POLICY_CAP_RATIO:-0.5}"
      TSIP_MODE_DEFAULT: "${TSIP_MODE_DEFAULT:-vehicle}"
      TSIP_TIER_DEFAULT: "${TSIP_TIER_DEFAULT:-transit}"
      TSIP_ALLOWED_MODES: "${TSIP_ALLOWED_MODES:-walk,bike,vehicle,transit}"
      TSIP_PAYLOAD_BINDING_ENABLE: "${TSIP_PAYLOAD_BINDING_ENABLE:-1}"
      TSIP_SECRET_BINDING_ENABLE: "${TSIP_SECRET_BINDING_ENABLE:-1}"
      TSIP_SNARKJS: "snarkjs"
      TSIP_PROVER: "${TSIP_PROVER:-rapidsnark}"
      TSIP_WASM: "/app/zk/tsip_main_v3_${TSIP_CIRCUIT_PROFILE:-k6}/tsip_main_v3_${TSIP_CIRCUIT_PROFILE:-k6}_js/tsip_main_v3_${TSIP_CIRCUIT_PROFILE:-k6}.wasm"
      TSIP_ZKEY: "/app/zk/tsip_main_v3_${TSIP_CIRCUIT_PROFILE:-k6}/tsip_main_v3_${TSIP_CIRCUIT_PROFILE:-k6}_final.zkey"
      TSIP_EA_SIGNING_SK: "${TSIP_EA_SIGNING_SK:-53e7ddc909b2f3c63b919a65ba44081d7589bae0f6bb87a653cad4fd850a4ef4}"
      TSIP_EA_KID: "${TSIP_EA_KID:-ea-dev}"
      TSIP_EA_EXP_SEC: "${TSIP_EA_EXP_SEC:-86400}"
      TSIP_TIMEOUT_SEC: "${TSIP_TIMEOUT_SEC:-20}"
      TSIP_RECOVERY_STATE_URL: "http://shuffler:8001/tsip/state"
      TSIP_LOC_HASH_MODE: "${TSIP_LOC_HASH_MODE:-poseidon2}"
      TSIP_POSEIDON_SNARKJS: "snarkjs"
