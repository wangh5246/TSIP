  aggregator_a:
    build:
      context: .
      dockerfile: services/aggregator_a/Dockerfile
    ports:
      - "8002:8002"
    environment:
      AGG_R_BASE: "http://aggregator_r:8003/dump_share"
      DECODE_ENABLE: "1"
      DECODE_AUDIT_URL: "http://decoder:8010/authorize_decode"
      DECODE_VERIFY_URL: "http://decoder:8010/verify_decode"
      DECODE_URL: "http://decoder:8010/decode_tokens"
      DECODE_MAX: "50"
      PRP_ROUNDS: "8"
      DECODE_ROUTER_TOKEN: "decode_router_v1"
      DECODE_ROUTER_SECRET: "decode_router_secret_v1"
      DECODE_SHARE_MAX_PER_ROUND: "50"
      AUDIT_CALLER_TOKEN: "audit_caller_v1"
      CLOVER_KEY_SHARE: "6f0f9a3b4e2d1c0f7e6d5c4b3a291807f0e1d2c3b4a5968778695a4b3c2d1e0f"
      CLOVER_CLIENT_TOKEN: "client_token_a_v1"
      K: "50"
      KD: "50"
      DOMAIN: "10000"
      MASK_BITS: "32"
      DP_EPSILON_TOTAL: "${DP_EPSILON_TOTAL:-1.0}"
      DP_EPSILON_SVT: "${DP_EPSILON_SVT:-0.3}"
      DP_EPSILON_VAL: "${DP_EPSILON_VAL:-0.7}"
      DP_TAU: "${DP_TAU:-3.0}"
      DP_TAU2: "${DP_TAU2:-3.0}"
      DP_SENSITIVITY: "${DP_SENSITIVITY:-1.0}"
      DP_DECODE_ENABLE: "${DP_DECODE_ENABLE:-0}"
      SHUFFLER_COMMITTEE_ENABLE: "${SHUFFLER_COMMITTEE_ENABLE:-0}"
      SHUFFLER_COMMITTEE_THRESHOLD: "${SHUFFLER_COMMITTEE_THRESHOLD:-1}"
      SHUFFLER_COMMITTEE_KEYS: "${SHUFFLER_COMMITTEE_KEYS:-s1:shuffler_sign_s1,s2:shuffler_sign_s2,s3:shuffler_sign_s3}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

