services:
  shuffler:
    build:
      context: .
      dockerfile: services/shuffler/Dockerfile
    environment:
      AGG_A_URL: "http://aggregator_a:8002/forward"
      AGG_R_URL: "http://aggregator_r:8003/forward"
      FLUSH_SECONDS: "${FLUSH_SECONDS:-2}"
      K: "50"
      KD: "50"
      DOMAIN: "10000"
      MASK_BITS: "32"
      RISERFL_SEED_SECRET: "rise_fed"
      CITY_SIZE_M: "10000"
      DT_SEC: "10"
      TRAJ_POINTS: "300"
      MAX_STEP_M: "${SHUFFLER_MAX_STEP_M:-110.0}"
      PROOF_ENABLE: "${SHUFFLER_PROOF_ENABLE:-0}"
      PROOF_M: "${PROOF_M:-8}"
      PROOF_ALPHA: "${PROOF_ALPHA:-0.05}"
      PROOF_DIM: "${PROOF_DIM:-299}"
      PROOF_B_SCALE: "${PROOF_B_SCALE:-0.93}"
      PROOF_CALIBRATE: "${PROOF_CALIBRATE:-1}"
      PROOF_CALIBRATION_SAMPLES: "${PROOF_CALIBRATION_SAMPLES:-800}"
      ZK_STEP_ENABLE: "${SHUFFLER_ZK_STEP_ENABLE:-1}"
      ZK_STEP_SNARKJS: "snarkjs"
      ZK_STEP_VKEY: "/app/zk/tsip_step/verification_key.json"
      ZK_STEP_VERIFY_TIMEOUT_SEC: "${ZK_STEP_VERIFY_TIMEOUT_SEC:-30}"
      TSIP_ENABLE: "${SHUFFLER_TSIP_ENABLE:-0}"
      TSIP_VERIFY_MODE: "${TSIP_VERIFY_MODE:-full}"
      TSIP_SNARKJS: "snarkjs"
      TSIP_CIRCUIT_PROFILE: "${TSIP_CIRCUIT_PROFILE:-k6}"
      TSIP_VKEY: "/app/zk/tsip_main_v3_${TSIP_CIRCUIT_PROFILE:-k6}/verification_key.json"
      TSIP_VERIFY_TIMEOUT_SEC: "${TSIP_VERIFY_TIMEOUT_SEC:-30}"
      TSIP_WINDOW_SEC: "${TSIP_WINDOW_SEC:-60}"
      TSIP_MAX_GAP_WINDOWS: "${TSIP_MAX_GAP_WINDOWS:-2}"
      TSIP_BLACKLIST_THRESHOLD: "${TSIP_BLACKLIST_THRESHOLD:-3}"
      TSIP_DEBUG: "${TSIP_DEBUG:-0}"
      TSIP_BOOTSTRAP_POLICY: "${TSIP_BOOTSTRAP_POLICY:-legacy_accept}"
      TSIP_VERIFY_DP_ENABLE: "${TSIP_VERIFY_DP_ENABLE:-0}"
      TSIP_VERIFY_EPSILON: "${TSIP_VERIFY_EPSILON:-0.2}"
      TSIP_VERIFY_NOISY_THRESHOLD: "${TSIP_VERIFY_NOISY_THRESHOLD:-0.5}"
      TSIP_VERIFY_DP_SEED: "${TSIP_VERIFY_DP_SEED:-rise_fed}"
      # C6: ADWC profile and policy cap
      TSIP_ADWC_PROFILE: "${TSIP_ADWC_PROFILE:-k6}"
      TSIP_ADWC_WINDOW_K: "${TSIP_ADWC_WINDOW_K:-6}"
      TSIP_POLICY_CAP_RATIO: "${TSIP_POLICY_CAP_RATIO:-0.5}"
      TSIP_MODE_DEFAULT: "${TSIP_MODE_DEFAULT:-vehicle}"
      TSIP_TIER_DEFAULT: "${TSIP_TIER_DEFAULT:-transit}"
      TSIP_ALLOWED_MODES: "${TSIP_ALLOWED_MODES:-walk,bike,vehicle,transit}"
      TSIP_EA_REQUIRE: "${TSIP_EA_REQUIRE:-1}"
      TSIP_EA_PUBKEYS: "${TSIP_EA_PUBKEYS:-ea-dev:b74d9156553132240a79cf426f509823691faaf97c29f13d0da7a3e137bdc649}"
      TSIP_EA_ALLOW_EXPIRED_SEC: "${TSIP_EA_ALLOW_EXPIRED_SEC:-0}"
      # P3: min aggregators (trust model)
      TSIP_MIN_AGGREGATORS: "${TSIP_MIN_AGGREGATORS:-1}"
      # P4: payload binding
      TSIP_PAYLOAD_BINDING_ENABLE: "${TSIP_PAYLOAD_BINDING_ENABLE:-1}"
      # P5: secret binding
      TSIP_SECRET_BINDING_ENABLE: "${TSIP_SECRET_BINDING_ENABLE:-1}"
      SHUFFLER_COMMITTEE_ENABLE: "${SHUFFLER_COMMITTEE_ENABLE:-0}"
      SHUFFLER_COMMITTEE_ID: "${SHUFFLER_COMMITTEE_ID:-s1}"
      SHUFFLER_COMMITTEE_SIGN_SECRET: "${SHUFFLER_COMMITTEE_SIGN_SECRET:-shuffler_sign_s1}"
      SHUFFLER_COMMITTEE_THRESHOLD: "${SHUFFLER_COMMITTEE_THRESHOLD:-1}"
      SHUFFLER_COMMITTEE_PEERS: "${SHUFFLER_COMMITTEE_PEERS:-http://shuffler2:8001,http://shuffler3:8001}"
      SHUFFLER_COMMITTEE_TIMEOUT_SEC: "${SHUFFLER_COMMITTEE_TIMEOUT_SEC:-3}"
      SHUFFLER_COMMITTEE_ATTEST_PATH: "${SHUFFLER_COMMITTEE_ATTEST_PATH:-/committee/attest}"
      SHUFFLER_COMMITTEE_TOKEN: "${SHUFFLER_COMMITTEE_TOKEN:-}"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

