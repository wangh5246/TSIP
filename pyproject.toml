[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "waybill-formal"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "cryptography==50.0.0",
  "fastapi==0.139.2",
  "matplotlib==3.10.7",
  "pandas==2.3.3",
  "psutil==5.9.0",
  "pyarrow==23.0.1",
  "pydantic==2.13.4",
  "psycopg[binary]==3.3.4",
  "sqlalchemy==2.0.51",
  "starlette==1.3.1",
  "uvicorn==0.30.1",
]

[project.optional-dependencies]
dev = [
  "flake8==7.0.0",
  "httpx2==2.9.1",
  "mypy==1.11.2",
  "pytest==9.0.3",
]

[tool.setuptools]
packages = ["common", "waybill_formal"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = [
  "^experiments/",
  "^WayBill/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
