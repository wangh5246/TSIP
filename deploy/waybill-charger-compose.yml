services:
  postgres:
    image: ${WAYBILL_POSTGRES_IMAGE:-waybill-postgres:readiness-v2}
    build:
      context: ..
      dockerfile: deploy/postgres/Dockerfile
      args:
        WAYBILL_GIT_COMMIT: ${WAYBILL_GIT_COMMIT:?set WAYBILL_GIT_COMMIT}
        WAYBILL_GIT_TREE: ${WAYBILL_GIT_TREE:?set WAYBILL_GIT_TREE}
        WAYBILL_CODE_MANIFEST_SHA256: ${WAYBILL_CODE_MANIFEST_SHA256:?set WAYBILL_CODE_MANIFEST_SHA256}
        WAYBILL_PROTOCOL_SHA256: ${WAYBILL_PROTOCOL_SHA256:?set WAYBILL_PROTOCOL_SHA256}
    user: "70:70"
    environment:
      POSTGRES_DB: waybill
      POSTGRES_USER: waybill
      POSTGRES_PASSWORD: ${WAYBILL_POSTGRES_PASSWORD:?set WAYBILL_POSTGRES_PASSWORD}
    volumes:
      - waybill-postgres-data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp:uid=70,gid=70,mode=1777
      - /var/run/postgresql:uid=70,gid=70,mode=3775
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waybill -d waybill"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  charger:
    image: ${WAYBILL_CHARGER_IMAGE:-waybill-charger:readiness-v2}
    build:
      context: ..
      dockerfile: services/charger/Dockerfile
      args:
        WAYBILL_GIT_COMMIT: ${WAYBILL_GIT_COMMIT:?set WAYBILL_GIT_COMMIT}
        WAYBILL_GIT_TREE: ${WAYBILL_GIT_TREE:?set WAYBILL_GIT_TREE}
        WAYBILL_CODE_MANIFEST_SHA256: ${WAYBILL_CODE_MANIFEST_SHA256:?set WAYBILL_CODE_MANIFEST_SHA256}
        WAYBILL_PROTOCOL_SHA256: ${WAYBILL_PROTOCOL_SHA256:?set WAYBILL_PROTOCOL_SHA256}
    environment:
      WAYBILL_CHARGER_DATABASE_URL: ${WAYBILL_CHARGER_DATABASE_URL:?set WAYBILL_CHARGER_DATABASE_URL}
      WAYBILL_CHARGER_DOMAIN: ${WAYBILL_CHARGER_DOMAIN:?set WAYBILL_CHARGER_DOMAIN}
      WAYBILL_CHARGER_ADMIN_TOKEN: ${WAYBILL_CHARGER_ADMIN_TOKEN:?set WAYBILL_CHARGER_ADMIN_TOKEN}
      WAYBILL_CHARGER_TOKEN_PEPPER: ${WAYBILL_CHARGER_TOKEN_PEPPER:?set WAYBILL_CHARGER_TOKEN_PEPPER}
      WAYBILL_CHARGER_TEST_MODE: "0"
      SETTLEMENT_POLICY_PROFILE_DIR: /app/configs/settlement_policy_profiles
    command:
      - uvicorn
      - services.charger.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8020"
      - --workers
      - "1"
      - --ssl-certfile
      - /run/waybill-tls/charger-server-chain.pem
      - --ssl-keyfile
      - /run/waybill-tls/charger-server.key
      - --no-proxy-headers
      - --no-server-header
    ports:
      - "127.0.0.1:8443:8020"
    volumes:
      - /etc/waybill/tls:/run/waybill-tls:ro
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  waybill-postgres-data:
